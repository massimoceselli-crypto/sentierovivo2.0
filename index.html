<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sentierovivo2.0</title>
</head>
<body style="background:#121212; color:#ffffff; font-family:system-ui, sans-serif; padding:16px;">
    
    <!-- Contenitore per il messaggio di benvenuto -->
    <div id="welcome-box"></div>

    <!-- Pannello della licenza / periodo di prova -->
    <div id="license-panel" style="max-width:460px; margin:16px auto; background:#1e1e1e; padding:16px; border-radius:12px; border:1px solid #333; display:none;">
        <p id="license-status-text" style="margin-bottom:10px; font-size:14px;"></p>
        <input id="license-code-input" type="text" placeholder="Inserisci codice di sblocco..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #555; background:#2a2a2a; color:#fff; margin-bottom:10px; box-sizing:border-box;">
        <button onclick="handleLicenseSubmit()" style="width:100%; padding:12px; border:none; border-radius:8px; background:#2e7d32; color:#fff; font-weight:bold; cursor:pointer;">Attiva Licenza</button>
    </div>

    <!-- Caricamento dei file JavaScript separati -->
    <script src="benvenuto.js"></script>
    <script src="licenza.js"></script>
    <script>
        function refreshLicenseUi() {
            renderWelcomeScreen('welcome-box');
            const state = initTrialAndLicense();
            const panel = document.getElementById('license-panel');
            const statusText = document.getElementById('license-status-text');

            if (state.status === 'expired') {
                panel.style.display = 'block';
                statusText.innerText = "I 30 giorni di prova sono terminati. Contatta la persona che ha creato l'app per ricevere il codice di attivazione.";
            } else if (state.status === 'tampered') {
                panel.style.display = 'block';
                statusText.innerText = "Rilevata un'anomalia nella data del dispositivo. Inserisci il codice di attivazione.";
            } else if (state.status === 'trial') {
                panel.style.display = 'block';
                statusText.innerText = `Prova attiva: hai ancora ${state.daysLeft} giorni. Puoi già inserire un codice se lo possiedi.`;
            } else {
                panel.style.display = 'none';
            }
        }

        function handleLicenseSubmit() {
            const code = document.getElementById('license-code-input').value;
            if (activateLicenseKey(code)) {
                alert("Licenza attivata con successo per sentierovivo2.0!");
                refreshLicenseUi();
            } else {
                alert("Codice non valido.");
            }
        }

        window.addEventListener('DOMContentLoaded', refreshLicenseUi);
    </script>
</body>
</html>
